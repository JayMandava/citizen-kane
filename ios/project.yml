name: CitizenKane
options:
  bundleIdPrefix: dev.jeyanth
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.13.9

targets:
  CitizenKane:
    type: application
    platform: iOS
    sources:
      - path: CitizenKane
      - path: Shared
    info:
      path: CitizenKane/Info.plist
      properties:
        CFBundleDisplayName: Citizen Kane
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [NTR-Regular.ttf]
    entitlements:
      path: CitizenKane/CitizenKane.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jeyanth.citizenkane
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.citizenkane
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  CitizenKaneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CitizenKaneTests
    dependencies:
      - target: CitizenKane
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jeyanth.citizenkane.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CitizenKane:
    build:
      targets:
        CitizenKane: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CitizenKaneTests
    archive:
      config: Release
